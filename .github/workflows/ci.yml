name: CI - RecargaYa

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Instalar dependencias
        run: uv sync --dev

      - name: Tests TDD unitarios
        run: uv run pytest tests/test_recarga.py -v

      - name: Tabla de equivalencia y valores limite
        run: uv run pytest tests/test_tabla_equivalencia.py -v

      - name: Tests BDD Gherkin
        run: uv run pytest tests/features/ -v

      - name: Tests API REST
        run: uv run pytest tests/test_api.py -v

      - name: Suite completa con cobertura
        run: uv run pytest --cov=src --cov-report=term-missing -v

  performance:
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Instalar dependencias
        run: uv sync --dev

      - name: Iniciar API en segundo plano
        run: uv run uvicorn src.recargaya.api:app --host 0.0.0.0 --port 8000 &
             sleep 3

      - name: Ejecutar prueba de carga (30 usuarios, 30s)
        run: |
          uv run locust -f tests/performance/locustfile.py \
            --headless -u 30 -r 10 --run-time 30s \
            --csv=tests/performance/results \
            --host http://localhost:8000

      - name: Verificar P95 menor a 300ms
        run: uv run python scripts/check_p95.py tests/performance/results_stats.csv
